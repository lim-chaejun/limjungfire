<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 다크모드 깜빡임 방지 -->
  <script>(function(){var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark')})();</script>
  <!-- Microsoft Clarity -->
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "v48dmfyli0");
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <title>페이지를 찾을 수 없습니다 | 소방체크</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .not-found {
      text-align: center;
      padding: 64px 20px 48px;
    }
    .not-found-code {
      font-size: 64px;
      font-weight: 800;
      color: var(--color-primary);
      line-height: 1;
      margin-bottom: 16px;
    }
    .not-found h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 10px;
    }
    .not-found p {
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .not-found-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .not-found-actions a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
    }
    .not-found-actions .primary {
      background: var(--color-primary);
      color: #fff;
    }
    .not-found-actions .secondary {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 공통 헤더 -->
    <div id="header-container"></div>

    <main class="not-found">
      <div class="not-found-code">404</div>
      <h1>페이지를 찾을 수 없습니다</h1>
      <p>주소가 바뀌었거나 삭제된 페이지입니다.<br>홈에서 건축물을 검색하거나 시설 가이드를 확인해 보세요.</p>
      <div class="not-found-actions">
        <a class="primary" href="/">홈으로</a>
        <a class="secondary" href="/guide/">시설 가이드</a>
      </div>
    </main>
  </div>

  <script type="module" src="/js/components.js"></script>
</body>
</html>
