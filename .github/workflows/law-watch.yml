name: law-watch

# 매주 law.go.kr 에서 소방시설법(법·영·규칙)과 화재안전기준(NFPC/NFSC 고시) 연혁을 확인해
# 사이트 연혁 데이터에 없는 개정을 `law-update` 이슈로 알린다. 실행 실패는 `law-watch-broken` 이슈.
on:
  schedule:
    - cron: '7 0 * * 1' # 월 00:07 UTC = 월 09:07 KST
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: '이슈 동기화 생략 (only 를 쓰거나 기본 브랜치가 아니면 항상 생략)'
      only:
        type: string
        default: ''
        description: 'source id 목록 (쉼표 구분, 예: decree,nfpc-108) — 부분 결과이므로 이슈는 건드리지 않는다'

permissions: {}

concurrency:
  group: law-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    env:
      RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      GH_REPO: '${{ github.repository }}'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # 저장소 코드가 도는 동안 .git/config 에 토큰을 남기지 않는다
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false # 의존성을 설치하지 않는다
      - name: 감시 도구 테스트
        # 셸이 펼치는 파일 목록 — Node 22 의 --test 는 디렉터리 인자를 받지 않는다
        run: node --test scripts/law-watch/test/*.test.mjs
      - name: law.go.kr 확인
        id: run
        # check.mjs 는 http.deadlineMs(기본 15분)에 스스로 멈추고 result.json 을 남긴다.
        # 이 제한은 그마저 멈추지 않을 때의 안전장치다 — 잘리면 아래 동기화가 CHECK_STEP_FAILED 로 알린다.
        timeout-minutes: 20
        env:
          ONLY: '${{ inputs.only }}'
        run: |
          set +e
          node scripts/law-watch/check.mjs --out .law-watch-out --record ${ONLY:+--only "$ONLY"}
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true # 업로드가 실패해도 이슈 동기화는 한다
        with:
          name: 'law-watch-${{ github.run_id }}-${{ github.run_attempt }}' # 재실행 때 이름 충돌 방지
          path: .law-watch-out/
          include-hidden-files: true # 점(.)으로 시작하는 폴더는 v4.4+ 기본값으로 빠진다
          retention-days: 30
      - name: 이슈 동기화 (dry-run 이면 할 일만 출력)
        # 앞 단계가 실패·시간 초과여도 돈다 — 결과가 없으면 CHECK_STEP_FAILED 로 broken 이슈를 연다
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: '${{ github.token }}'
          # 비어 있으면(앞 단계 실패로 check 가 안 돌았거나 잘림) 'none' → sync 가 비정상 종료로 본다
          CODE: "${{ steps.run.outputs.code || 'none' }}"
          # 수동 실행에서 dry_run 이거나, only 로 일부만 봤거나, 기본 브랜치가 아니면 이슈를 건드리지 않는다
          # (부분·다른 브랜치 결과로 이슈를 닫지 않도록). schedule 이벤트에는 repository 정보가 없을 수 있어 이벤트를 먼저 본다.
          DRY_RUN: "${{ (github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.only != '' || github.ref_name != github.event.repository.default_branch)) && '--dry-run' || '' }}"
        run: node scripts/law-watch/sync-issues.mjs --out .law-watch-out --code "$CODE" $DRY_RUN
      - name: 실패 표시
        if: ${{ steps.run.outputs.code != '0' && steps.run.outputs.code != '10' }}
        env:
          CODE: "${{ steps.run.outputs.code || 'none' }}"
        run: echo "::error::law-watch broken (exit $CODE)" && exit 1

  # 60일 동안 저장소 활동이 없으면 GitHub 이 예약 실행을 끈다 → 다시 켜고, main 이 50일 넘게 조용하면 기록 커밋
  # 주의: main 이 보호 브랜치(직접 push 금지)면 기록 커밋 push 가 실패해 이 작업이 빨간불이 되고, 60일 무활동 뒤
  # 예약 실행이 꺼지면 이 작업도 더는 돌지 않는다. 보호를 켤 때는 github-actions[bot] 의 push 를 허용하거나,
  # "scheduled workflow disabled" 알림을 받으면 Actions 탭에서 law-watch 를 다시 켠다.
  # 기록 파일 .github/law-watch/status.json 은 공개 사이트로도 나갈 수 있지만 마지막 확인 시각뿐이다.
  keepalive:
    needs: check
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: '${{ github.token }}'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/law-watch.yml/enable"
      - run: |
          [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -lt 4320000 ] && exit 0
          mkdir -p .github/law-watch && date -u +'{"lastChecked":"%FT%TZ"}' > .github/law-watch/status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/law-watch/status.json && git commit -m 'chore(law-watch): keep-alive [CF-Pages-Skip]' && git push
