name: law-watch

# 매주 law.go.kr 에서 소방시설법(법·영·규칙)과 화재안전기준(NFPC/NFSC 고시) 연혁을 확인해
# 사이트 연혁 데이터에 없는 개정을 `law-update` 이슈로 알린다. 실행 실패는 `law-watch-broken` 이슈.
on:
  schedule:
    - cron: '7 0 * * 1' # 월 00:07 UTC = 월 09:07 KST
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: '이슈 동기화 생략'
      only:
        type: string
        default: ''
        description: 'source id 목록 (쉼표 구분, 예: decree,nfpc-108)'

permissions: {}

concurrency:
  group: law-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    env:
      RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 감시 도구 테스트
        # 셸이 펼치는 파일 목록 — Node 20 과 22+ 모두 동작 (22+ 는 --test 에 디렉터리를 받지 않는다)
        run: node --test scripts/law-watch/test/*.test.mjs
      - name: law.go.kr 확인
        id: run
        env:
          ONLY: '${{ inputs.only }}'
        run: |
          set +e
          node scripts/law-watch/check.mjs --out .law-watch-out --record ${ONLY:+--only "$ONLY"}
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'law-watch-${{ github.run_id }}'
          path: .law-watch-out/
          include-hidden-files: true # 점(.)으로 시작하는 폴더는 v4.4+ 기본값으로 빠진다
          retention-days: 30
      - name: 이슈 동기화 (dry_run 이면 할 일만 출력)
        env:
          GH_TOKEN: '${{ github.token }}'
          DRY_RUN: "${{ inputs.dry_run && '--dry-run' || '' }}"
        run: node scripts/law-watch/sync-issues.mjs --out .law-watch-out --code "${{ steps.run.outputs.code }}" $DRY_RUN
      - name: 실패 표시
        if: ${{ steps.run.outputs.code != '0' && steps.run.outputs.code != '10' }}
        run: echo "::error::law-watch broken (exit ${{ steps.run.outputs.code }})" && exit 1

  # 60일 동안 저장소 활동이 없으면 GitHub 이 예약 실행을 끈다 → 다시 켜고, main 이 50일 넘게 조용하면 기록 커밋
  keepalive:
    needs: check
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: '${{ github.token }}'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/law-watch.yml/enable"
      - run: |
          [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -lt 4320000 ] && exit 0
          mkdir -p .github/law-watch && date -u +'{"lastChecked":"%FT%TZ"}' > .github/law-watch/status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/law-watch/status.json && git commit -m 'chore(law-watch): keep-alive [CF-Pages-Skip]' && git push
